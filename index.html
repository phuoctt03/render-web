<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Preview Studio</title>
<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --surface3: #30363d;
  --border: #30363d;
  --accent: #58a6ff;
  --accent2: #3fb950;
  --accent3: #f78166;
  --accent4: #d2a8ff;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #6e7681;
  --hover: #1f2937;
  --tab-active: #1c2128;
  --glow: 0 0 20px rgba(88,166,255,0.15);
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  letter-spacing: -0.3px;
}

.logo svg { color: var(--accent); }

.topbar-actions { display: flex; gap: 8px; margin-left: auto; align-items: center; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: none;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  color: #0d1117;
}
.btn-primary:hover { background: #79b8ff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(88,166,255,0.3); }

.btn-success {
  background: var(--accent2);
  color: #0d1117;
}
.btn-success:hover { background: #56d364; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(63,185,80,0.3); }

.btn-ghost {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface3); }

.btn-danger {
  background: transparent;
  color: var(--accent3);
  border: 1px solid var(--accent3);
}
.btn-danger:hover { background: rgba(247,129,102,0.1); }

.btn-sm { padding: 4px 10px; font-size: 12px; }

/* ── LAYOUT ── */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 12px 14px 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.file-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s ease;
  position: relative;
  user-select: none;
}

.file-item:hover { background: var(--surface2); }
.file-item.active { background: var(--surface3); }
.file-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 60%;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

.file-icon {
  font-size: 14px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.file-name {
  font-size: 13px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: 'JetBrains Mono', monospace;
}

.file-badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  text-transform: uppercase;
}
.badge-html { background: rgba(247,129,102,0.2); color: #f78166; }
.badge-css  { background: rgba(88,166,255,0.2);  color: #58a6ff; }
.badge-js   { background: rgba(210,168,255,0.2); color: #d2a8ff; }
.badge-main { background: rgba(63,185,80,0.2);   color: #3fb950; font-size: 9px; }

.file-remove {
  opacity: 0;
  transition: opacity 0.12s;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 3px;
  color: var(--text3);
  font-size: 13px;
  flex-shrink: 0;
  background: none;
  border: none;
}
.file-item:hover .file-remove { opacity: 1; }
.file-remove:hover { color: var(--accent3); background: rgba(247,129,102,0.1); }

.empty-state {
  padding: 20px 14px;
  text-align: center;
  color: var(--text3);
  font-size: 12px;
  line-height: 1.6;
}

/* ── DROP ZONE ── */
.drop-zone {
  margin: 8px;
  padding: 16px 12px;
  border: 2px dashed var(--border);
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--text3);
  font-size: 12px;
  background: transparent;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(88,166,255,0.05);
}
.drop-zone svg { margin-bottom: 6px; display: block; margin-left: auto; margin-right: auto; }

/* ── EDITOR PANEL ── */
.editor-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.editor-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-shrink: 0;
}

.editor-tabs::-webkit-scrollbar { height: 3px; }
.editor-tabs::-webkit-scrollbar-track { background: var(--surface); }
.editor-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.editor-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
  border-right: 1px solid var(--border);
  background: var(--surface);
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}
.editor-tab:hover { color: var(--text); background: var(--tab-active); }
.editor-tab.active {
  color: var(--text);
  background: var(--bg);
  border-bottom: 2px solid var(--accent);
  margin-bottom: -1px;
}

.editor-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.code-editor {
  width: 100%;
  height: 100%;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  line-height: 1.7;
  border: none;
  outline: none;
  resize: none;
  tab-size: 2;
  display: none;
}
.code-editor.active { display: block; }
.code-editor::placeholder { color: var(--text3); }
.code-editor::-webkit-scrollbar { width: 6px; }
.code-editor::-webkit-scrollbar-track { background: transparent; }
.code-editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.no-file-msg {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text3);
  gap: 12px;
  font-size: 14px;
}
.no-file-msg svg { opacity: 0.3; }

/* ── DIVIDER ── */
.divider {
  width: 5px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background 0.15s;
  position: relative;
}
.divider:hover, .divider.dragging { background: var(--accent); }

/* ── PREVIEW PANEL ── */
.preview-panel {
  width: 50%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-left: 1px solid var(--border);
}

.preview-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.preview-dots { display: flex; gap: 6px; }
.preview-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
}
.dot-red { background: #ff5f57; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #28ca41; }

.preview-title {
  font-size: 12px;
  color: var(--text2);
  flex: 1;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
}

.preview-actions { display: flex; gap: 6px; margin-left: auto; }

.preview-frame {
  flex: 1;
  position: relative;
  background: white;
}

#preview {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

.preview-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  background: var(--surface);
  color: var(--text3);
  gap: 14px;
  font-size: 14px;
  text-align: center;
}
.preview-placeholder p { max-width: 200px; line-height: 1.5; }

/* ── STATUS BAR ── */
.statusbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 4px 14px;
  background: var(--accent);
  color: #0d1117;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
}
.statusbar .divider-v { width: 1px; height: 12px; background: rgba(0,0,0,0.2); }
.status-item { display: flex; align-items: center; gap: 4px; }
.status-right { margin-left: auto; display: flex; gap: 16px; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 480px;
  max-width: 95vw;
  box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(-10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal h3 { font-size: 16px; margin-bottom: 16px; color: var(--text); }
.modal-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
}
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

/* ── TOAST ── */
.toast-container { position: fixed; bottom: 40px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: toastIn 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 300px;
}
.toast.success { border-color: var(--accent2); }
.toast.error { border-color: var(--accent3); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Scrollbar global */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    Web Preview Studio
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" onclick="newFile()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      New File
    </button>
    <label class="btn btn-ghost" style="cursor:pointer">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import Files
      <input type="file" id="fileInput" multiple accept=".html,.css,.js,.htm" style="display:none" onchange="handleFileImport(this)">
    </label>
    <button class="btn btn-success" onclick="runPreview()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      Run
    </button>
    <button class="btn btn-ghost" onclick="clearAll()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      Clear
    </button>
  </div>
</header>

<!-- WORKSPACE -->
<div class="workspace">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      Files
      <span id="fileCount" style="background:var(--surface3);padding:1px 6px;border-radius:10px;font-size:10px;color:var(--text2);">0</span>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="opacity:0.5">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17,8 12,3 7,8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Drop files here<br/>or click to browse
    </div>

    <div class="file-list" id="fileList">
      <div class="empty-state" id="emptyState">
        No files yet.<br/>Import HTML, CSS, JS<br/>files to get started.
      </div>
    </div>
  </aside>

  <!-- EDITOR -->
  <div class="editor-panel" id="editorPanel">
    <div class="editor-tabs" id="editorTabs"></div>
    <div class="editor-area" id="editorArea">
      <div class="no-file-msg" id="noFileMsg">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
        </svg>
        <span>Import hoặc tạo file để bắt đầu</span>
      </div>
    </div>
  </div>

  <!-- DIVIDER -->
  <div class="divider" id="divider"></div>

  <!-- PREVIEW -->
  <div class="preview-panel" id="previewPanel">
    <div class="preview-header">
      <div class="preview-dots">
        <div class="preview-dot dot-red"></div>
        <div class="preview-dot dot-yellow"></div>
        <div class="preview-dot dot-green"></div>
      </div>
      <span class="preview-title">preview</span>
      <div class="preview-actions">
        <button class="btn btn-ghost btn-sm" onclick="resetZoom()" title="Reset zoom">⊞</button>
        <button class="btn btn-ghost btn-sm" onclick="openExternal()" title="Open in new tab">↗</button>
        <button class="btn btn-ghost btn-sm" onclick="refreshPreview()" title="Refresh">↻</button>
      </div>
    </div>
    <div class="preview-frame">
      <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms" title="Preview"></iframe>
      <div class="preview-placeholder" id="previewPlaceholder">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24" style="opacity:0.3">
          <rect x="3" y="3" width="18" height="13" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <p>Import files và nhấn <strong style="color:var(--accent2)">Run</strong> để xem preview</p>
      </div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <span class="status-item">
    <svg width="10" height="10" fill="currentColor" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"/></svg>
    Web Preview Studio
  </span>
  <div class="divider-v"></div>
  <span id="statusLang">—</span>
  <div class="status-right">
    <span id="statusCursor">Ln 1, Col 1</span>
    <span id="statusFiles">0 files</span>
    <span id="statusSize">0 B</span>
  </div>
</div>

<!-- MODAL: New File -->
<div class="modal-overlay" id="newFileModal">
  <div class="modal">
    <h3>✨ Tạo file mới</h3>
    <input class="modal-input" id="newFileName" placeholder="index.html, style.css, app.js ..." />
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" onclick="setNewName('index.html')">index.html</button>
      <button class="btn btn-ghost btn-sm" onclick="setNewName('style.css')">style.css</button>
      <button class="btn btn-ghost btn-sm" onclick="setNewName('script.js')">script.js</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
      <button class="btn btn-primary" onclick="confirmNewFile()">Tạo</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const state = {
  files: {},        // name -> { content, type }
  activeFile: null,
  previewDoc: null,
};

// ─── FILE UTILS ──────────────────────────────────────────────────────────────
function getFileType(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['html','htm'].includes(ext)) return 'html';
  if (ext === 'css') return 'css';
  if (ext === 'js') return 'js';
  return 'txt';
}

function getFileIcon(type) {
  const icons = { html:'🌐', css:'🎨', js:'⚡', txt:'📄' };
  return icons[type] || '📄';
}

function getMainHtmlFile() {
  // priority: index.html > first .html file
  if (state.files['index.html']) return 'index.html';
  return Object.keys(state.files).find(n => getFileType(n) === 'html') || null;
}

function buildPreviewDoc() {
  const mainHtml = getMainHtmlFile();
  if (!mainHtml) {
    // no HTML: wrap JS+CSS in a simple page
    let css = '', js = '';
    for (const [name, f] of Object.entries(state.files)) {
      if (f.type === 'css') css += f.content + '\n';
      if (f.type === 'js')  js  += f.content + '\n';
    }
    return `<!DOCTYPE html><html><head><style>${css}</style></head><body><script>${js}<\/script></body></html>`;
  }

  let doc = state.files[mainHtml].content;

  // Inline CSS files: replace <link> tags or inject before </head>
  for (const [name, f] of Object.entries(state.files)) {
    if (f.type !== 'css') continue;
    const linkRe = new RegExp(`<link[^>]+href=["']${escapeRe(name)}["'][^>]*>`, 'gi');
    if (linkRe.test(doc)) {
      doc = doc.replace(linkRe, `<style>/* ${name} */\n${f.content}\n</style>`);
    } else {
      doc = doc.replace(/<\/head>/i, `<style>/* ${name} */\n${f.content}\n</style>\n</head>`);
    }
  }

  // Inline JS files: replace <script src> tags or inject before </body>
  for (const [name, f] of Object.entries(state.files)) {
    if (f.type !== 'js') continue;
    const scriptRe = new RegExp(`<script[^>]+src=["']${escapeRe(name)}["'][^>]*><\/script>`, 'gi');
    if (scriptRe.test(doc)) {
      doc = doc.replace(scriptRe, `<script>/* ${name} */\n${f.content}\n<\/script>`);
    } else {
      doc = doc.replace(/<\/body>/i, `<script>/* ${name} */\n${f.content}\n<\/script>\n</body>`);
    }
  }

  return doc;
}

function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(2) + ' MB';
}

// ─── FILE MANAGEMENT ─────────────────────────────────────────────────────────
function addFile(name, content) {
  const type = getFileType(name);
  state.files[name] = { content, type };
  renderFileList();
  renderEditorTabs();
  setActiveFile(name);
  updateStatus();
  toast(`📁 ${name} đã được thêm`, 'success');
}

function removeFile(name, e) {
  e.stopPropagation();
  delete state.files[name];
  if (state.activeFile === name) {
    const remaining = Object.keys(state.files);
    state.activeFile = remaining.length ? remaining[0] : null;
  }
  renderFileList();
  renderEditorTabs();
  renderEditorArea();
  updateStatus();
  toast(`🗑️ Đã xoá ${name}`);
}

function setActiveFile(name) {
  // save current editor content
  if (state.activeFile) {
    const ta = document.getElementById('editor_' + safeId(state.activeFile));
    if (ta && state.files[state.activeFile]) {
      state.files[state.activeFile].content = ta.value;
    }
  }
  state.activeFile = name;
  renderFileList();
  renderEditorTabs();
  renderEditorArea();
  updateStatusLang();
}

function safeId(name) {
  return name.replace(/[^a-zA-Z0-9]/g, '_');
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderFileList() {
  const list = document.getElementById('fileList');
  const empty = document.getElementById('emptyState');
  const count = Object.keys(state.files).length;
  document.getElementById('fileCount').textContent = count;

  // remove old items
  list.querySelectorAll('.file-item').forEach(el => el.remove());

  if (count === 0) {
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  for (const [name, f] of Object.entries(state.files)) {
    const item = document.createElement('div');
    item.className = 'file-item' + (name === state.activeFile ? ' active' : '');
    item.onclick = () => setActiveFile(name);

    const isMain = name === getMainHtmlFile();
    item.innerHTML = `
      <span class="file-icon">${getFileIcon(f.type)}</span>
      <span class="file-name" title="${name}">${name}</span>
      ${isMain ? '<span class="file-badge badge-main">MAIN</span>' : ''}
      <span class="file-badge badge-${f.type}">${f.type.toUpperCase()}</span>
      <button class="file-remove" onclick="removeFile('${name}', event)" title="Remove">✕</button>
    `;
    list.appendChild(item);
  }
}

function renderEditorTabs() {
  const tabs = document.getElementById('editorTabs');
  tabs.innerHTML = '';
  for (const [name, f] of Object.entries(state.files)) {
    const tab = document.createElement('div');
    tab.className = 'editor-tab' + (name === state.activeFile ? ' active' : '');
    tab.onclick = () => setActiveFile(name);
    tab.innerHTML = `${getFileIcon(f.type)} ${name}`;
    tabs.appendChild(tab);
  }
}

function renderEditorArea() {
  const area = document.getElementById('editorArea');
  const noMsg = document.getElementById('noFileMsg');

  // hide all editors
  area.querySelectorAll('.code-editor').forEach(el => { el.className = el.className.replace(' active',''); });

  if (!state.activeFile || !state.files[state.activeFile]) {
    if (noMsg) noMsg.style.display = '';
    return;
  }
  if (noMsg) noMsg.style.display = 'none';

  const edId = 'editor_' + safeId(state.activeFile);
  let ta = document.getElementById(edId);

  if (!ta) {
    ta = document.createElement('textarea');
    ta.id = edId;
    ta.className = 'code-editor';
    ta.spellcheck = false;
    ta.autocorrect = 'off';
    ta.autocapitalize = 'off';
    ta.value = state.files[state.activeFile].content;
    ta.oninput = () => {
      state.files[state.activeFile].content = ta.value;
      updateStatus();
    };
    ta.onkeydown = handleEditorKeydown;
    ta.onclick = ta.onkeyup = updateCursorStatus;
    area.appendChild(ta);
  }

  ta.className = 'code-editor active';
  ta.focus();
}

function handleEditorKeydown(e) {
  // Tab -> 2 spaces
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 2;
    if (state.activeFile) state.files[state.activeFile].content = this.value;
  }
}

// ─── IMPORT ──────────────────────────────────────────────────────────────────
function handleFileImport(input) {
  const files = Array.from(input.files);
  files.forEach(file => readFile(file));
  input.value = '';
}

function readFile(file) {
  const reader = new FileReader();
  reader.onload = e => addFile(file.name, e.target.result);
  reader.readAsText(file);
}

// ─── DRAG & DROP ─────────────────────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  Array.from(e.dataTransfer.files).forEach(readFile);
});

// also support drop on the whole workspace
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) {
    Array.from(e.dataTransfer.files).forEach(readFile);
  }
});

// ─── RUN / PREVIEW ───────────────────────────────────────────────────────────
function runPreview() {
  // sync active editor
  if (state.activeFile) {
    const ta = document.getElementById('editor_' + safeId(state.activeFile));
    if (ta && state.files[state.activeFile]) {
      state.files[state.activeFile].content = ta.value;
    }
  }

  if (Object.keys(state.files).length === 0) {
    toast('⚠️ Chưa có file nào!', 'error');
    return;
  }

  const doc = buildPreviewDoc();
  state.previewDoc = doc;

  const frame = document.getElementById('preview');
  const placeholder = document.getElementById('previewPlaceholder');
  placeholder.style.display = 'none';
  frame.style.display = 'block';
  frame.srcdoc = doc;

  toast('▶ Preview đã được cập nhật', 'success');
}

function refreshPreview() {
  if (state.previewDoc) runPreview();
}

let previewWin = null;
function openExternal() {
  if (!state.previewDoc) { toast('Chạy preview trước!', 'error'); return; }
  const blob = new Blob([state.previewDoc], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  previewWin = window.open(url, '_blank');
}

function resetZoom() {
  const frame = document.getElementById('preview');
  frame.style.transform = 'scale(1)';
}

// ─── NEW FILE ─────────────────────────────────────────────────────────────────
function newFile() {
  document.getElementById('newFileModal').classList.add('open');
  setTimeout(() => document.getElementById('newFileName').focus(), 100);
}

function setNewName(name) {
  document.getElementById('newFileName').value = name;
  document.getElementById('newFileName').focus();
}

function closeModal() {
  document.getElementById('newFileModal').classList.remove('open');
  document.getElementById('newFileName').value = '';
}

function confirmNewFile() {
  const name = document.getElementById('newFileName').value.trim();
  if (!name) { toast('Nhập tên file!', 'error'); return; }
  if (state.files[name]) { toast(`File "${name}" đã tồn tại!`, 'error'); return; }
  const templates = {
    html: `<!DOCTYPE html>\n<html lang="vi">\n<head>\n  <meta charset="UTF-8">\n  <title>My Page</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n\n  <h1>Hello World</h1>\n\n  <script src="script.js"><\/script>\n</body>\n</html>`,
    css:  `/* Styles */\n\nbody {\n  margin: 0;\n  font-family: sans-serif;\n}\n`,
    js:   `// JavaScript\n\nconsole.log('Hello!');\n`,
  };
  const type = getFileType(name);
  addFile(name, templates[type] || '');
  closeModal();
}

document.getElementById('newFileName').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmNewFile();
  if (e.key === 'Escape') closeModal();
});

document.getElementById('newFileModal').addEventListener('click', e => {
  if (e.target === document.getElementById('newFileModal')) closeModal();
});

// ─── CLEAR ───────────────────────────────────────────────────────────────────
function clearAll() {
  if (!Object.keys(state.files).length) return;
  if (!confirm('Xoá tất cả file?')) return;
  state.files = {};
  state.activeFile = null;
  state.previewDoc = null;
  document.getElementById('editorTabs').innerHTML = '';
  document.getElementById('editorArea').querySelectorAll('.code-editor').forEach(el => el.remove());
  document.getElementById('editorArea').querySelector('#noFileMsg').style.display = '';
  document.getElementById('preview').srcdoc = '';
  document.getElementById('previewPlaceholder').style.display = '';
  renderFileList();
  updateStatus();
  toast('🗑️ Đã xoá tất cả');
}

// ─── STATUS ──────────────────────────────────────────────────────────────────
function updateStatus() {
  const count = Object.keys(state.files).length;
  document.getElementById('statusFiles').textContent = count + ' file' + (count !== 1 ? 's' : '');
  let total = 0;
  for (const f of Object.values(state.files)) total += (f.content || '').length;
  document.getElementById('statusSize').textContent = formatBytes(total);
}

function updateStatusLang() {
  if (state.activeFile) {
    const type = getFileType(state.activeFile).toUpperCase();
    document.getElementById('statusLang').textContent = type;
  } else {
    document.getElementById('statusLang').textContent = '—';
  }
}

function updateCursorStatus() {
  const ta = document.querySelector('.code-editor.active');
  if (!ta) return;
  const text = ta.value.substring(0, ta.selectionStart);
  const lines = text.split('\n');
  const ln = lines.length;
  const col = lines[lines.length - 1].length + 1;
  document.getElementById('statusCursor').textContent = `Ln ${ln}, Col ${col}`;
}

// ─── RESIZE DIVIDER ──────────────────────────────────────────────────────────
(function initDivider() {
  const divider = document.getElementById('divider');
  const editor  = document.getElementById('editorPanel');
  const preview = document.getElementById('previewPanel');
  const workspace = document.querySelector('.workspace');
  let dragging = false, startX, startEW, startPW;

  divider.addEventListener('mousedown', e => {
    dragging = true;
    startX  = e.clientX;
    startEW = editor.offsetWidth;
    startPW = preview.offsetWidth;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const total = startEW + startPW;
    let newEW = Math.max(200, startEW + dx);
    let newPW = Math.max(200, total - newEW);
    editor.style.flex = 'none';
    editor.style.width = newEW + 'px';
    preview.style.flex = 'none';
    preview.style.width = newPW + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      divider.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });
})();

// ─── TOAST ───────────────────────────────────────────────────────────────────
function toast(msg, type = '') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

// ─── KEYBOARD SHORTCUTS ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runPreview(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); newFile(); }
});

// ─── SERVICE WORKER ──────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/render-web/service-worker.js').catch(() => {});
}

// init
updateStatus();
</script>
</body>
</html>
